name: "Continuous AI-BOM Scanner"
description: "EU AI Act compliance in CI: AI-BOM, risk register, and Annex IV documentation on every push."
author: "AIcap"

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-directory:
    description: "The directory to scan for AI dependencies"
    required: false
    default: "."
  api-key:
    description: "Pro Tier: Your AIcap API Key to sync results to your dashboard"
    required: false
  annex-iv-path:
    description: "Where to write the Annex IV technical documentation draft. Free — no API key needed. A draft generated without an API key is marked unattested in its § 5, because a document produced on the machine that holds the code proves nothing to a third party; syncing with an API key anchors it to the audit ledger."
    required: false
    default: "aicap-annex-iv.md"

outputs:
  compliance-status:
    description: "EU AI Act posture from the scan (e.g. 'Passed' or 'Action Required (Annex IV Documentation Missing)'). Set even when the scan fails the job, so later steps with if: always() can report on it."
    value: ${{ steps.scan.outputs.compliance-status }}
  annex-iv-path:
    description: "Path to the generated Annex IV markdown draft, for a later upload-artifact or PR-comment step."
    value: ${{ steps.scan.outputs.annex-iv-path }}

runs:
  using: "composite"
  steps:
    - name: Download AIcap Scanner
      shell: bash
      env:
        # The digest of the release binary this version of the action
        # runs. It lives here, in the tagged action.yml, rather than being
        # fetched from the release: a checksum downloaded from the same
        # place as the binary only detects corruption, while one pinned in
        # the action also detects a release asset that was swapped after
        # the tag was cut. Produced by scripts/build-release.sh, which builds from
        # a clean export of the tagged source; updated with the version at release
        # time; the release binary is built with -buildvcs=false so its
        # digest does not depend on the commit that records it.
        AICAP_SHA256: 1c5e891baaa46ac0c9a126b9e51d536be4b9a3cc2a6a72e1ac9058cf242fe8c1
      run: |
        echo "⬇️ Downloading AIcap v1.8.0 statically-linked binary..."
        # -f: a 404 or 5xx is an error, not an HTML page saved as "aicap".
        curl -fsSL --retry 3 https://github.com/aicaplabs/AIcap/releases/download/v1.8.0/aicap-linux-amd64 -o aicap
        echo "${AICAP_SHA256}  aicap" | sha256sum -c -
        chmod +x aicap

    - name: Execute AI-BOM Scan
      id: scan
      shell: bash
      env:
        AICAP_API_KEY: ${{ inputs.api-key }}
        # Inputs reach the script as environment variables, never by
        # interpolation into the script text: an input containing shell
        # syntax would otherwise be executed rather than passed.
        SCAN_DIRECTORY: ${{ inputs.scan-directory }}
        ANNEX_IV_PATH: ${{ inputs.annex-iv-path }}
      run: |
        echo "🔍 Starting Continuous AI-BOM Scan on directory: ${SCAN_DIRECTORY}"
        # stdout is exactly one JSON document (the AI-BOM); progress, the
        # verdict and the badge go to stderr and show in the log. Capture
        # stdout for the compliance-status output while preserving the
        # CLI's exit code (0 pass / 1 unmitigated high-risk / 2 policy
        # blocker) so the job still gates merges.
        set +e
        ./aicap --cli "${SCAN_DIRECTORY}" \
          --annex-iv "${ANNEX_IV_PATH}" | tee aicap-scan-output.txt
        exit_code=${PIPESTATUS[0]}
        status=$(grep -o '"complianceStatus": *"[^"]*"' aicap-scan-output.txt | head -1 | sed 's/.*: *"\(.*\)"/\1/')
        echo "compliance-status=${status:-Unknown}" >> "$GITHUB_OUTPUT"
        echo "annex-iv-path=${ANNEX_IV_PATH}" >> "$GITHUB_OUTPUT"
        exit "$exit_code"
