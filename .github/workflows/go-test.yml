name: Tests

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go build
        run: go build ./...
      # vet both build configurations: the integration tests only compile
      # under their tag, so a plain `go vet ./...` never looks at them.
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: go test (unit)
        run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    # Reachability-based: fails only for advisories in code this module
    # actually calls, in its dependencies or in the Go standard library.
    # The first run of this check found 27 — nearly all standard-library
    # fixes the build was missing because go.mod pinned an old patch
    # release. Bumping the `toolchain` line in go.mod is the usual fix.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    # Matches docker-compose.yml and TEST_DATABASE_URL in the local dev loop,
    # so `go test -tags=integration` behaves identically on a laptop and in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicap
          POSTGRES_PASSWORD: aicap
          POSTGRES_DB: aicap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicap -d aicap"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go test (integration)
        env:
          TEST_DATABASE_URL: postgres://aicap:aicap@localhost:5432/aicap?sslmode=disable
        run: go test -tags=integration -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    # Wave 5: lint + Vitest + Vite build for the React frontend.
    # `npm ci` would be stricter but the lockfile stays out of git
    # while we settle the dep set; switch to `ci` once stable.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04 in
    # October 2026 and Playwright 1.60 refuses to install Chromium there
    # ("does not support chromium on ubuntu26.04-x64"), so this job failed
    # before running a single spec. Return to ubuntu-latest when
    # @playwright/test is bumped to a release that supports 26.04.
    runs-on: ubuntu-24.04
    needs: frontend
    # Wave 12: Playwright E2E. One actively-exercised spec
    # (scan-to-annex) runs against `npm run dev` with the backend
    # mocked via route handlers; the signup/checkout + rotate-key
    # specs ship as test.fixme placeholders for the next iteration.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
